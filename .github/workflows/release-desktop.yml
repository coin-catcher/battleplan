name: Release Battleplan desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and attach installers to (e.g. v1.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-desktop-reusable.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
