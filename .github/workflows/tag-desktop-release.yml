name: Tag desktop release

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag from package.json
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" = "develop" ]; then
            TAG="v${VERSION}-test-$(date +%s)"
            KIND="develop test"
          else
            TAG="v${VERSION}"
            KIND="production"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "kind=${KIND}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${KIND} tag: ${TAG}"

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.meta.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on this commit or locally."
            exit 1
          fi
          git tag -a "$TAG" -m "Battleplan desktop ${{ steps.meta.outputs.kind }} release ${TAG}"
          git push origin "$TAG"
